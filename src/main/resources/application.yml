spring:
  application:
    name: secure-notes
  datasource:
    url: jdbc:h2:mem:notes;DB_CLOSE_DELAY=-1
    username: sa
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
  mvc:
    problemdetails:
      enabled: true

server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: secure-notes
  default-user:
    username: ${APP_USERNAME}
    password: ${APP_PASSWORD}
